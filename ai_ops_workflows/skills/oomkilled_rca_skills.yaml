# =============================================================================
# SKILLS — OOMKilled / CrashLoopBackOff RCA Agent
#
# Skills are the tool definitions the Claude agent uses to reason and act.
# Each skill maps to one MCP server tool call. The agent decides which skills
# to invoke based on the incident context — it is not a fixed pipeline.
#
# Runtime: Claude claude-sonnet-4-5 (claude-sonnet-4-6 for prod) with tool_use.
# Trigger: PagerDuty webhook → Lambda → agent invocation.
#
# MCP servers required (see mcp-config.json):
#   kubernetes, google-cloud-monitoring, google-cloud-trace,
#   google-cloud-logging, pagerduty, github
# =============================================================================

metadata:
  name: oomkilled-rca-agent
  version: "2.1.0"
  owner: platform-sre@homedepot.com
  description: >
    Automated RCA and runbook generation for OOMKilled and CrashLoopBackOff
    events on GKE. Correlates pod events, memory metrics, traces, and logs
    into a structured incident report and posts findings to PagerDuty.

system_prompt: |
  You are a senior SRE agent embedded in the Home Depot platform engineering team.
  You are investigating a Kubernetes OOMKilled or CrashLoopBackOff incident on the
  production GKE cluster (prod-webapp-gke, us-central1).

  When called, you will:
  1. Gather all available signals about the failing pod/deployment
  2. Correlate memory metrics, pod events, logs, and traces
  3. Identify the root cause with high confidence before proposing a fix
  4. Generate a structured runbook entry with diagnosis, cause, fix, and prevention
  5. Post your findings to the PagerDuty incident as a note
  6. Create a GitHub issue in the runbooks repo if this is a novel failure pattern

  Rules:
  - Never propose a fix without first confirming the root cause in the data
  - Always check if the same pod/deployment OOMKilled in the last 7 days before
    calling this a one-off vs a recurring pattern
  - If memory usage is within 20% of the limit, recommend a limit increase AND
    a VPA (Vertical Pod Autoscaler) setup, not just a one-time fix
  - If the OOM correlates with a recent deployment (last 2 hours), flag it as
    a regression and suggest a rollback before a limit increase

# =============================================================================
# KUBERNETES SKILLS
# =============================================================================

skills:

  - name: get_pod_status
    server: kubernetes
    tool: kubectl_get
    description: >
      Get the current status of all pods in a namespace. Use this first to
      identify which pods are in OOMKilled, CrashLoopBackOff, or Error state.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
          description: Kubernetes namespace (e.g. webapp, checkout, inventory)
        label_selector:
          type: string
          description: Optional label filter e.g. app=cart-service
        output_format:
          type: string
          enum: [wide, json, yaml]
          default: wide
      required: [namespace]
    output: pod name, ready status, restart count, age, node assignment

  - name: describe_pod
    server: kubernetes
    tool: kubectl_describe
    description: >
      Full describe output for a specific pod. Reveals Last State reason
      (OOMKilled), exit code (137 = SIGKILL), memory limits vs requests,
      and the Events section showing BackOff messages and scheduling history.
      Always call this after get_pod_status identifies a crashing pod.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
        pod_name:
          type: string
          description: Exact pod name from get_pod_status output
      required: [namespace, pod_name]
    output: full pod spec, resource limits, last state, events timeline

  - name: get_pod_logs
    server: kubernetes
    tool: kubectl_logs
    description: >
      Retrieve logs from a crashing container. Use previous=true to get logs
      from the crashed instance (current logs may be empty if container just started).
      For OOMKilled pods, the process is killed mid-execution — logs cut off abruptly.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
        pod_name:
          type: string
        container_name:
          type: string
          description: Required for multi-container pods
        previous:
          type: boolean
          description: true = logs from the crashed previous instance
          default: true
        tail_lines:
          type: integer
          description: Number of lines from the end
          default: 100
      required: [namespace, pod_name]
    output: container stdout/stderr, last N lines before crash

  - name: get_deployment_history
    server: kubernetes
    tool: kubectl_rollout_history
    description: >
      Get the rollout history for a deployment. Use this to check if an OOM
      event correlates with a recent deployment — if the last rollout was < 2 hours
      ago, this is likely a regression from the new image/config, not a capacity issue.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
        deployment_name:
          type: string
      required: [namespace, deployment_name]
    output: revision history, change-cause annotations, timestamps

  - name: get_resource_limits
    server: kubernetes
    tool: kubectl_get
    description: >
      Get the LimitRange and ResourceQuota for a namespace. Use this to understand
      the guardrails in place and whether the current limits are default-injected
      (LimitRange) or explicitly set in the Deployment manifest.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
      required: [namespace]
    output: LimitRange defaults, ResourceQuota consumed vs allowed

  - name: get_node_pressure
    server: kubernetes
    tool: kubectl_describe_node
    description: >
      Describe the node where the OOMKilled pod was running. Check MemoryPressure
      condition — if true, the node itself is under memory pressure and the kubelet
      may be evicting pods beyond just the one that hit its limit.
    input_schema:
      type: object
      properties:
        node_name:
          type: string
          description: Node name from describe_pod output (e.g. gke-prod-pool-abc123)
      required: [node_name]
    output: node conditions (MemoryPressure, DiskPressure), allocatable vs allocated memory

# =============================================================================
# CLOUD MONITORING SKILLS
# =============================================================================

  - name: get_memory_usage_timeseries
    server: google-cloud-monitoring
    tool: timeseries_query
    description: >
      Query container memory usage over the last hour for a specific pod or
      deployment. Compare against the memory limit to quantify how close to the
      limit the container was running — this determines whether a small limit bump
      fixes it or whether there is a memory leak.
    input_schema:
      type: object
      properties:
        deployment_name:
          type: string
        namespace:
          type: string
        window_minutes:
          type: integer
          default: 60
        aggregation:
          type: string
          enum: [ALIGN_MEAN, ALIGN_MAX, ALIGN_P99]
          default: ALIGN_MAX
      required: [deployment_name, namespace]
    mql_template: |
      fetch k8s_container
      | metric 'kubernetes.io/container/memory/used_bytes'
      | filter
          resource.cluster_name = 'prod-webapp-gke'
          && resource.namespace_name = '${namespace}'
          && metadata.system_labels.top_level_controller_name = '${deployment_name}'
      | within ${window_minutes}m
      | group_by [resource.pod_name], [max(val())]
    output: per-pod memory usage timeseries, peak usage vs configured limit

  - name: get_oom_event_history
    server: google-cloud-monitoring
    tool: timeseries_query
    description: >
      Count OOMKilled events for this deployment over the last 7 days.
      Use this to determine if this is a recurring pattern vs an isolated spike.
      Recurring OOMs (> 3 times/week) indicate a systematic memory limit
      misconfiguration or a gradual memory leak.
    input_schema:
      type: object
      properties:
        deployment_name:
          type: string
        namespace:
          type: string
        lookback_days:
          type: integer
          default: 7
      required: [deployment_name, namespace]
    mql_template: |
      fetch k8s_container
      | metric 'kubernetes.io/container/restart_count'
      | filter
          resource.cluster_name = 'prod-webapp-gke'
          && resource.namespace_name = '${namespace}'
          && metadata.system_labels.top_level_controller_name = '${deployment_name}'
      | within ${lookback_days}d
      | group_by [resource.pod_name], [sum(delta(val()))]
    output: restart count per pod over the lookback window, trend direction

  - name: get_node_memory_saturation
    server: google-cloud-monitoring
    tool: timeseries_query
    description: >
      Check node-level memory saturation at the time of the OOM event.
      If node memory was > 90% utilized at the OOM time, the root cause may be
      node-level pressure (too many pods on this node) vs container-level limit
      misconfiguration. These have different fixes.
    input_schema:
      type: object
      properties:
        node_name:
          type: string
        event_timestamp:
          type: string
          description: ISO8601 timestamp of the OOM event to look back from
      required: [node_name, event_timestamp]
    output: node memory utilisation % at OOM time, top memory consumers on that node

  - name: get_jvm_heap_metrics
    server: google-cloud-monitoring
    tool: timeseries_query
    description: >
      For Java Spring Boot services, query JVM heap and non-heap usage from
      the OTEL collector metrics (exposed via Prometheus scrape on port 8888).
      JVM OOMs can be caused by heap exhaustion, metaspace overflow, or
      off-heap native memory growth — each has a different fix.
    input_schema:
      type: object
      properties:
        service_name:
          type: string
        namespace:
          type: string
        window_minutes:
          type: integer
          default: 60
      required: [service_name, namespace]
    mql_template: |
      fetch prometheus_target
      | metric 'prometheus.googleapis.com/jvm_memory_used_bytes/gauge'
      | filter
          metric.area = 'heap'
          && resource.namespace = '${namespace}'
          && resource.job = '${service_name}'
      | within ${window_minutes}m
      | group_by [metric.area, metric.type], [max(val())]
    output: JVM heap used vs max, GC pause frequency, metaspace usage

# =============================================================================
# CLOUD TRACE SKILLS
# =============================================================================

  - name: get_traces_at_oom_time
    server: google-cloud-trace
    tool: list_traces
    description: >
      Retrieve distributed traces for the service in the 5-minute window before
      the OOM event. Look for requests with unusually large payloads, long-running
      spans that held memory, or JDBC queries that returned unexpectedly large
      result sets — these are common causes of OOM spikes in Java services.
    input_schema:
      type: object
      properties:
        service_name:
          type: string
        start_time:
          type: string
          description: ISO8601 — start of the window (5 min before OOM)
        end_time:
          type: string
          description: ISO8601 — time of OOM event
        filter:
          type: string
          description: Optional filter e.g. +has_error:true or +latency:>5000ms
      required: [service_name, start_time, end_time]
    output: list of traces with span count, latency, error status, root span URL

  - name: get_trace_detail
    server: google-cloud-trace
    tool: get_trace
    description: >
      Get full span tree for a specific trace ID. Use this when get_traces_at_oom_time
      returns a suspicious trace (high latency, large response, DB query anomaly).
      The span tree shows exactly which downstream call was in flight when memory spiked.
    input_schema:
      type: object
      properties:
        trace_id:
          type: string
          description: 32-char hex trace ID from get_traces_at_oom_time
      required: [trace_id]
    output: full span hierarchy, db.statement values, messaging.destination, span durations

# =============================================================================
# CLOUD LOGGING SKILLS
# =============================================================================

  - name: get_structured_logs
    server: google-cloud-logging
    tool: query_logs
    description: >
      Query structured JSON logs from Cloud Logging for the crashing pod.
      Because every log line includes trace_id (from the OTEL W3C traceparent
      pipeline), you can correlate logs → traces → memory spike in a single query.
      Look for OutOfMemoryError stack traces, GC overhead limit exceeded, or
      Direct buffer memory errors.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
        pod_name:
          type: string
        start_time:
          type: string
          description: ISO8601 — look back from this time
        severity_filter:
          type: string
          enum: [ERROR, WARNING, INFO, DEBUG]
          default: ERROR
        keyword_filter:
          type: string
          description: Optional grep e.g. OutOfMemoryError, GC overhead, java.lang.OutOfMemory
      required: [namespace, pod_name, start_time]
    log_query_template: |
      resource.type="k8s_container"
      resource.labels.namespace_name="${namespace}"
      resource.labels.pod_name="${pod_name}"
      severity>="${severity_filter}"
      timestamp >= "${start_time}"
      "${keyword_filter}"
    output: structured log lines with trace_id, log.level, message, stack traces

  - name: get_gc_logs
    server: google-cloud-logging
    tool: query_logs
    description: >
      Query JVM garbage collection logs for Java Spring Boot services.
      Frequent full GC cycles (> 5/minute) that free < 10% of heap indicate
      the heap is exhausted and OOM is imminent. GC logs are emitted to stdout
      when JVM is started with -Xlog:gc*.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
        deployment_name:
          type: string
        window_minutes:
          type: integer
          default: 30
      required: [namespace, deployment_name]
    output: GC event frequency, heap before/after GC, GC pause duration trend

# =============================================================================
# PAGERDUTY SKILLS
# =============================================================================

  - name: get_incident_details
    server: pagerduty
    tool: get_incident
    description: >
      Retrieve the PagerDuty incident that triggered this RCA. Extract the
      service name, escalation policy, current assignee, and any prior notes
      added by the on-call engineer before the agent was invoked.
    input_schema:
      type: object
      properties:
        incident_id:
          type: string
          description: PagerDuty incident ID (e.g. P1A2B3C)
      required: [incident_id]
    output: incident title, service, severity, assignee, timeline, existing notes

  - name: get_recent_incidents
    server: pagerduty
    tool: list_incidents
    description: >
      List all incidents for this service in the last 30 days. Use this to
      determine if OOM events are a recurring pattern — if the same service
      has had > 3 OOM incidents in 30 days, the runbook should recommend
      a permanent fix (HPA memory-based scaling or VPA) not just a one-time
      limit increase.
    input_schema:
      type: object
      properties:
        service_name:
          type: string
        since_days:
          type: integer
          default: 30
        statuses:
          type: array
          items:
            type: string
          default: [triggered, acknowledged, resolved]
      required: [service_name]
    output: incident list with timestamps, resolution times, titles

  - name: post_rca_to_incident
    server: pagerduty
    tool: add_incident_note
    description: >
      Post the completed RCA and runbook to the PagerDuty incident as a note.
      This is the final step — it closes the loop between detection and resolution
      and creates an audit trail of what the agent found and recommended.
      Always call this after generating the runbook.
    input_schema:
      type: object
      properties:
        incident_id:
          type: string
        content:
          type: string
          description: >
            Full RCA note in markdown. Must include:
            - Summary (2 sentences)
            - Root cause (specific, not generic)
            - Evidence (metrics, log lines, trace IDs)
            - Immediate fix (kubectl command or Helm value)
            - Prevention (LimitRange, VPA, CI check)
            - Runbook link (GitHub)
      required: [incident_id, content]
    output: note ID, timestamp, PagerDuty incident URL

  - name: resolve_or_escalate_incident
    server: pagerduty
    tool: update_incident
    description: >
      Resolve the incident if root cause is confirmed and fix is applied,
      or escalate to the next tier if the agent cannot determine root cause
      with > 80% confidence. Never resolve an incident without evidence.
    input_schema:
      type: object
      properties:
        incident_id:
          type: string
        action:
          type: string
          enum: [resolve, escalate, acknowledge]
        escalation_level:
          type: integer
          description: For escalate action — 1 = L2, 2 = L3/principal
          default: 1
        resolution_summary:
          type: string
          description: Required for resolve action — one line explaining what was fixed
      required: [incident_id, action]
    output: updated incident status, escalation target if applicable

# =============================================================================
# GITHUB SKILLS
# =============================================================================

  - name: create_runbook_issue
    server: github
    tool: create_issue
    description: >
      Create a GitHub issue in the runbooks repo for novel failure patterns
      that don't have an existing runbook. The agent populates the issue with
      the full RCA so an SRE can review, refine, and merge it as a permanent
      runbook entry. Only call this if get_recent_incidents shows this is a
      new pattern (no prior incidents with the same root cause).
    input_schema:
      type: object
      properties:
        repo:
          type: string
          default: "homedepot-platform/runbooks"
        title:
          type: string
          description: e.g. "[OOMKilled] cart-service — heap exhausted by large CartItem payload"
        body:
          type: string
          description: Full runbook markdown including diagnosis steps, fix, prevention
        labels:
          type: array
          items:
            type: string
          default: [oomkilled, automated-rca, needs-review]
        assignees:
          type: array
          items:
            type: string
          description: GitHub usernames of the on-call engineer and service owner
      required: [title, body]
    output: GitHub issue URL, issue number
