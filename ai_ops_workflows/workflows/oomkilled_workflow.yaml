# =============================================================================
# WORKFLOW — OOMKilled / CrashLoopBackOff Automated RCA
#
# This is the declarative workflow definition. The agent (oomkilled_rca_agent.py)
# follows this logic but is not mechanically bound to it — Claude reasons through
# each step and may skip or reorder based on what the signals show.
#
# Trigger: PagerDuty incident with title matching /OOMKilled|CrashLoopBackOff|exit code 137/
# Runtime: Cloud Run Job (GCP) or AWS Lambda, invoked via PagerDuty webhook extension
# SLA: RCA posted to PagerDuty within 3 minutes of alert firing
# =============================================================================

name: oomkilled-rca
version: "2.1.0"
trigger:
  type: pagerduty_webhook
  event_filter: "incident.triggered"
  title_pattern: "OOMKilled|CrashLoopBackOff|exit code 137|memory"
  services:
    - cart-service
    - product-service
    - checkout-service
    - inventory-service
    - search-service

sla:
  rca_posted_within_minutes: 3
  escalate_if_confidence_below: 0.80

# =============================================================================
# PHASE 1 — Triage (parallel, < 30s)
# Goal: confirm the pod is OOMKilled and identify which container/node
# =============================================================================

phases:

  - name: triage
    description: Confirm OOMKilled state and gather basic context
    max_seconds: 30
    parallel: true
    steps:

      - skill: get_pod_status
        purpose: >
          Identify all pods in CrashLoopBackOff or OOMKilled state in the
          affected namespace. Get restart count to understand severity.
        inputs:
          namespace: "{{ alert.namespace }}"

      - skill: get_incident_details
        purpose: >
          Pull the PagerDuty incident to read any notes the on-call added
          before the agent started. Avoid duplicating investigation work.
        inputs:
          incident_id: "{{ alert.incident_id }}"

      - skill: get_recent_incidents
        purpose: >
          Check if this service has OOMed before. > 3 OOM incidents in 30 days
          = systemic issue, not a one-off. Changes the fix recommendation.
        inputs:
          service_name: "{{ alert.service_name }}"
          since_days: 30

# =============================================================================
# PHASE 2 — Deep diagnosis (sequential, < 60s)
# Goal: gather all signals needed to determine root cause
# =============================================================================

  - name: deep_diagnosis
    description: Correlate pod state, metrics, logs, and traces
    max_seconds: 60
    parallel: false
    steps:

      - skill: describe_pod
        purpose: >
          Get the full pod describe output. Critical fields:
          Last State.Reason (must be OOMKilled), Exit Code (137),
          Limits.memory vs Requests.memory, Events timeline.
        inputs:
          namespace: "{{ alert.namespace }}"
          pod_name: "{{ triage.crashing_pod_name }}"

      - skill: get_pod_logs
        purpose: >
          Read logs from the crashed container instance (previous=true).
          For Java services: look for OutOfMemoryError, GC overhead limit exceeded,
          Direct buffer memory. For Node.js: heap out of memory.
          For Go: runtime: out of memory.
        inputs:
          namespace: "{{ alert.namespace }}"
          pod_name: "{{ triage.crashing_pod_name }}"
          previous: true
          tail_lines: 150

      - skill: get_deployment_history
        purpose: >
          Check if a deployment rolled out < 2 hours before the OOM.
          If yes: this is a regression → recommend rollback before limit increase.
          If no: this is a capacity or leak issue → proceed with memory analysis.
        inputs:
          namespace: "{{ alert.namespace }}"
          deployment_name: "{{ alert.service_name }}"

      - skill: get_memory_usage_timeseries
        purpose: >
          Get memory usage over the last 60 minutes. Plot against the configured
          limit. Gradual climb = memory leak. Sudden spike = large request payload
          or GC failure. Flat near limit = limit is simply too low.
        inputs:
          deployment_name: "{{ alert.service_name }}"
          namespace: "{{ alert.namespace }}"
          window_minutes: 60
          aggregation: ALIGN_MAX

      - skill: get_node_pressure
        purpose: >
          Check if the node itself is under MemoryPressure. If yes, the kubelet
          may be evicting other pods too — this is a node-level capacity problem,
          not a container limit problem. Fix: add nodes or reduce pod density.
        inputs:
          node_name: "{{ triage.node_name }}"

      - skill: get_oom_event_history
        purpose: >
          Confirm restart count trend over 7 days. Feeds the recurring vs
          isolated determination.
        inputs:
          deployment_name: "{{ alert.service_name }}"
          namespace: "{{ alert.namespace }}"
          lookback_days: 7

# =============================================================================
# PHASE 3 — Trace and log correlation (parallel, < 45s)
# Goal: find the specific request or code path that caused the OOM
# =============================================================================

  - name: trace_correlation
    description: Correlate the OOM event with distributed traces and structured logs
    max_seconds: 45
    parallel: true
    condition: "{{ diagnosis.memory_spike_detected == true }}"
    steps:

      - skill: get_traces_at_oom_time
        purpose: >
          Find traces in the 5-minute window before OOM. Look for:
          - Requests with unusually high span counts (N+1 query patterns)
          - JDBC spans returning large result sets (db.rows_affected > 10000)
          - Pub/Sub messages with abnormally large payloads
          - Long-running requests that held large objects across GC cycles
        inputs:
          service_name: "{{ alert.service_name }}"
          start_time: "{{ alert.event_time - 5m }}"
          end_time: "{{ alert.event_time }}"

      - skill: get_structured_logs
        purpose: >
          Query Cloud Logging for ERROR-level logs in the crash window.
          trace_id from the W3C traceparent pipeline links these logs to the
          Cloud Trace spans from get_traces_at_oom_time.
        inputs:
          namespace: "{{ alert.namespace }}"
          pod_name: "{{ triage.crashing_pod_name }}"
          start_time: "{{ alert.event_time - 10m }}"
          severity_filter: ERROR
          keyword_filter: "OutOfMemoryError OR GC overhead OR Direct buffer"

      - skill: get_jvm_heap_metrics
        purpose: >
          For Java Spring Boot services: get JVM heap breakdown.
          Heap exhausted = increase Xmx or fix leak.
          Metaspace exhausted = classloader leak or too many dynamic proxies.
          Off-heap exhausted = native memory issue (Netty, direct buffers).
        inputs:
          service_name: "{{ alert.service_name }}"
          namespace: "{{ alert.namespace }}"
          window_minutes: 60
        condition: "{{ alert.service_type == 'java-spring-boot' }}"

# =============================================================================
# PHASE 4 — Root cause determination and fix recommendation
# This phase is Claude reasoning — no tool calls, pure analysis.
# =============================================================================

  - name: rca_synthesis
    description: Claude synthesises all signals into a root cause determination
    type: reasoning
    prompt: |
      Based on all signals gathered, determine the root cause with a confidence score (0-1).

      Decision tree:
        1. Was there a deployment in the last 2 hours?
           YES → Root cause: regression in new image. Fix: rollback + investigate memory delta.
        2. Is node MemoryPressure=True?
           YES → Root cause: node-level saturation. Fix: cordon + drain node, add capacity.
        3. Is memory usage climbing linearly over hours/days?
           YES → Root cause: memory leak. Fix: restart (immediate), profile + patch (permanent).
        4. Is memory usage flat near the limit with a sudden spike?
           YES → Root cause: limit too low for workload. Fix: increase limit + set VPA.
        5. Did a specific trace show abnormal payload or query size?
           YES → Root cause: specific request pattern. Fix: pagination, streaming, query optimisation.
        6. Does JVM metaspace show exhaustion (Java only)?
           YES → Root cause: classloader leak or proxy inflation. Fix: -XX:MaxMetaspaceSize, investigate leak.

      Output structured JSON:
        root_cause: string (one sentence, specific)
        confidence: float (0-1)
        evidence: list of strings (metric values, log excerpts, trace IDs)
        immediate_fix: string (kubectl or Helm command)
        permanent_fix: string (architectural or configuration change)
        is_recurring: boolean
        is_regression: boolean
        escalate: boolean (true if confidence < 0.80)

# =============================================================================
# PHASE 5 — Runbook generation and incident close
# =============================================================================

  - name: incident_close
    description: Post RCA to PagerDuty and create GitHub issue if novel pattern
    max_seconds: 30
    steps:

      - skill: post_rca_to_incident
        purpose: >
          Post the structured RCA as a PagerDuty incident note.
          This is the primary deliverable — closes the loop between alert and resolution.
        inputs:
          incident_id: "{{ alert.incident_id }}"
          content: |
            ## Automated RCA — {{ alert.service_name }}

            **Root cause:** {{ rca.root_cause }}
            **Confidence:** {{ rca.confidence | percent }}
            **Recurring:** {{ rca.is_recurring }}
            **Regression:** {{ rca.is_regression }}

            ### Evidence
            {{ rca.evidence | bullet_list }}

            ### Immediate fix
            ```bash
            {{ rca.immediate_fix }}
            ```

            ### Permanent fix
            {{ rca.permanent_fix }}

            ### Traces
            {{ trace_correlation.trace_ids | cloud_trace_links }}

            ---
            *Generated by OOMKilled RCA Agent v2.1.0 in {{ workflow.elapsed_seconds }}s*

      - skill: create_runbook_issue
        purpose: >
          Create a GitHub issue for novel failure patterns so the team can
          build a permanent runbook entry from the agent's findings.
        condition: "{{ rca.is_recurring == false and rca.confidence > 0.80 }}"
        inputs:
          title: "[OOMKilled] {{ alert.service_name }} — {{ rca.root_cause }}"
          body: "{{ runbook.full_markdown }}"
          labels: [oomkilled, automated-rca, needs-review]

      - skill: resolve_or_escalate_incident
        purpose: >
          Resolve if confidence > 0.80 and fix has been identified.
          Escalate to L2 if confidence < 0.80 or root cause is a leak/regression
          requiring human review before applying the fix.
        inputs:
          incident_id: "{{ alert.incident_id }}"
          action: "{{ 'resolve' if rca.confidence > 0.80 and not rca.escalate else 'escalate' }}"
          resolution_summary: "{{ rca.root_cause }} — fix: {{ rca.immediate_fix }}"
